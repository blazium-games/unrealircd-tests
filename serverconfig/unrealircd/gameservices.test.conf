/*
 * Blazium third/gameservices test configuration.
 * Active only when the module has been built into this install
 * (irctestframework/gameservices/run-suite). The games API is
 * irctestframework/gameservices/mock_api.py on 127.0.0.1:5800.
 *
 * The 1.x layout of the module only knows the first five directives;
 * tests/modules/gameservices_upgrade_rehash creates gameservices.v1-mode
 * while it runs the old build.
 */
@if module-exists("third/gameservices")
loadmodule "third/gameservices";

set { sasl-server "irc2.test.net"; }

gameservices {
	/* An IP, because the test resolver does not answer for localhost */
	api-url 'https://127.0.0.1:5800';
	api-key "gs-test-key";
	require-sasl yes;
	exempt "127.0.0.1";
	service-nick "blazium";
@if !file-exists("gameservices.v1-mode")
	reconcile-interval 5s;
	games-refresh-interval 15s;
	max-spectating 2;
	gameauth-attempts 3;
	gameauth-window 20s;
	load-balancing {
		max-local-users-per-channel 3;
	}
@endif
}
@endif
